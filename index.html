<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARISE</title>

    <script>
        if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark'); // Default to dark
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { slate: { 850: '#151e2e', 950: '#020617' } }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            overscroll-behavior-y: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #growth-modal {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #achievements-modal {
            transition: opacity 0.2s ease;
        }

        #streak-insights-modal,
        #task-insights-modal {
            transition: opacity 0.2s ease;
        }

        .insights-box {
            transition: transform 0.2s ease;
        }

        #task-detail-drawer {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        #task-detail-backdrop {
            transition: opacity 0.2s ease;
        }

        .modal-open {
            transform: translateY(0%);
        }

        .modal-closed {
            transform: translateY(100%);
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .pt-safe {
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* Dark mode date picker icon fix */
        .dark input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</head>

<body class="flex flex-col h-screen w-full relative bg-slate-50 dark:bg-slate-950 transition-colors duration-300">

    <!-- TOP HEADER -->
    <header
        class="fixed top-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 h-16 pt-safe z-40 grid grid-cols-[auto_minmax(0,1fr)_auto] items-center px-2 sm:flex sm:justify-between sm:px-4 transition-colors duration-300">
        <!-- Left: Stats -->
        <div class="flex items-center space-x-1 sm:space-x-4 text-sm font-medium">
            <button type="button" onclick="app.openStreakInsights()"
                class="flex items-center space-x-1 text-orange-500 dark:text-orange-400 hover:bg-orange-500/10 dark:hover:bg-orange-400/10 rounded-xl px-2 py-1 transition"
                title="Active Days Streak" aria-label="Open streak insights">
                <i data-lucide="flame" class="w-5 h-5"></i>
                <span id="header-streak" class="text-slate-800 dark:text-slate-200">0</span>
            </button>
            <button type="button" onclick="app.openTaskInsights()"
                class="flex items-center space-x-1 text-emerald-500 dark:text-emerald-400 hover:bg-emerald-500/10 dark:hover:bg-emerald-400/10 rounded-xl px-2 py-1 transition"
                title="Tasks Completed Today" aria-label="Open task completion insights">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                <span id="header-tasks" class="text-slate-800 dark:text-slate-200">0</span>
            </button>
        </div>

        <!-- Center: Date -->
        <div class="min-w-0 justify-self-center sm:absolute sm:left-1/2 sm:transform sm:-translate-x-1/2">
            <input type="date" id="date-picker" onchange="app.changeDate(this.value)"
                class="w-[8.25rem] max-w-full bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-white border border-slate-300 dark:border-slate-700 rounded-lg px-1.5 sm:px-2 py-1 text-sm font-semibold outline-none focus:border-emerald-500 transition shadow-sm cursor-pointer">
        </div>

        <!-- Right: Controls -->
        <div class="flex items-center space-x-1 sm:space-x-2">
            <button onclick="app.openAchievements()"
                class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-emerald-500 dark:hover:text-emerald-400 transition shadow-sm"
                title="Achievements">
                <i data-lucide="trophy" class="w-4 h-4"></i>
            </button>
            <button onclick="app.openProfile()"
                class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-emerald-500 dark:hover:text-emerald-400 transition shadow-sm"
                title="Profile & Settings">
                <i data-lucide="user" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <!-- Changed to flex flex-col so Journal can properly stretch -->
    <main id="main-content"
        class="flex-1 flex flex-col overflow-y-auto w-full max-w-3xl mx-auto pt-20 pb-20 px-4 hide-scrollbar transition-colors duration-300">
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav
        class="fixed bottom-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 h-16 pb-safe z-40 flex justify-around items-center px-2 transition-colors duration-300">
        <button onclick="app.switchTab('today')" id="nav-today"
            class="nav-btn flex flex-col items-center justify-center w-full h-full text-emerald-500 dark:text-emerald-400 transition">
            <i data-lucide="layout-dashboard" class="w-6 h-6 mb-1"></i><span
                class="text-[10px] font-medium">Today</span>
        </button>
        <button onclick="app.switchTab('growth')" id="nav-growth"
            class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 dark:hover:text-emerald-400 transition">
            <i data-lucide="grid" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Growth</span>
        </button>
        <button onclick="app.switchTab('progress')" id="nav-progress"
            class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 dark:hover:text-emerald-400 transition">
            <i data-lucide="activity" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Progress</span>
        </button>
        <button onclick="app.switchTab('journal')" id="nav-journal"
            class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 dark:hover:text-emerald-400 transition">
            <i data-lucide="book" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Journal</span>
        </button>
    </nav>

    <!-- PROFILE & SETTINGS MODAL -->
    <div id="profile-modal"
        class="fixed inset-0 bg-black/50 dark:bg-black/80 z-50 hidden flex items-center justify-center p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200"
            id="profile-box">
            <div
                class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950/50">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="user" class="w-5 h-5 text-emerald-500 dark:text-emerald-400"></i> Profile Setting
                </h3>
                <button onclick="app.closeProfile()"
                    class="text-slate-500 hover:text-slate-800 dark:hover:text-white p-1 transition"><i data-lucide="x"
                        class="w-5 h-5"></i></button>
            </div>

            <div class="p-5 space-y-6">
                <div>
                    <label
                        class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold mb-2 block">Operator
                        Name</label>
                    <input type="text" id="profile-name" onchange="app.saveProfileName(this.value)"
                        class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-white focus:border-emerald-500 outline-none transition"
                        placeholder="Your Name">
                </div>

                <div>
                    <label
                        class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold mb-2 block">Appearance</label>
                    <button onclick="app.toggleTheme()"
                        class="w-full flex items-center justify-between p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-white rounded-xl text-sm transition"
                        title="Toggle brightness" aria-label="Toggle brightness">
                        <span class="flex items-center gap-2"><i data-lucide="moon" id="theme-icon"
                                class="w-4 h-4 text-amber-500"></i><span>Brightness</span></span>
                        <span id="theme-mode" class="text-xs text-slate-500 dark:text-slate-400">Light</span>
                    </button>
                </div>

                <div>
                    <label
                        class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold mb-2 block">Data
                        Management</label>
                    <div class="space-y-2">
                        <button onclick="app.exportData()"
                            class="w-full flex items-center justify-center space-x-2 p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-white rounded-xl text-sm transition">
                            <i data-lucide="download"
                                class="w-4 h-4 text-emerald-500 dark:text-emerald-400"></i><span>Export Backup
                                (.json)</span>
                        </button>
                        <label
                            class="w-full flex items-center justify-center space-x-2 p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-white rounded-xl text-sm transition cursor-pointer">
                            <i data-lucide="upload" class="w-4 h-4 text-cyan-500 dark:text-cyan-400"></i><span>Import
                                Backup</span>
                            <input type="file" accept=".json" onchange="app.importData(event)" class="hidden">
                        </label>

                        <button onclick="app.downloadIndexedDbData()"
                            class="w-full flex items-center justify-center space-x-2 p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-white rounded-xl text-sm transition">
                            <i data-lucide="database"
                                class="w-4 h-4 text-violet-500 dark:text-violet-400"></i><span>Download
                                IndexedDB Data</span>
                        </button>

                    </div>

                    <div class="pt-2 border-t border-slate-200 dark:border-slate-800">
                        <button onclick="app.factoryReset()"
                            class="w-full flex items-center justify-center space-x-2 p-3 bg-rose-100 dark:bg-rose-500/10 hover:bg-rose-200 dark:hover:bg-rose-500/20 text-rose-600 dark:text-rose-500 border border-rose-200 dark:border-rose-500/20 rounded-xl text-sm transition font-medium">
                            <i data-lucide="alert-triangle" class="w-4 h-4"></i><span>Factory Reset</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ACHIEVEMENTS OVERVIEW MODAL -->
    <div id="achievements-modal"
        class="fixed inset-0 bg-black/50 dark:bg-black/80 z-[60] hidden flex items-center justify-center p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-3xl w-full max-w-2xl h-[85vh] overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200 flex flex-col"
            id="achievements-box">
            <div
                class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950/50 shrink-0">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="trophy" class="w-5 h-5 text-emerald-500 dark:text-emerald-400"></i> Achievements
                </h3>
                <button onclick="app.closeAchievements()"
                    class="text-slate-500 hover:text-slate-800 dark:hover:text-white p-1 transition"><i data-lucide="x"
                        class="w-5 h-5"></i></button>
            </div>

            <div class="p-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
                <div class="grid grid-cols-2 sm:grid-cols-[1.3fr_0.7fr_0.7fr] gap-3">
                    <div
                        class="col-span-2 sm:col-span-1 rounded-2xl bg-gradient-to-br from-emerald-500 to-cyan-500 text-white p-4 shadow-lg">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <div class="text-[10px] uppercase tracking-[0.2em] text-white/80 font-semibold">
                                    Achievement Score</div>
                                <div id="achievements-score" class="mt-1 text-4xl font-bold leading-none">0%</div>
                                <div id="achievements-score-detail" class="mt-2 text-sm text-white/90">0 of 0
                                    completed
                                </div>
                            </div>
                            <div class="h-11 w-11 rounded-2xl bg-white/15 flex items-center justify-center shrink-0">
                                <i data-lucide="award" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <div class="mt-4 h-2 rounded-full bg-white/20 overflow-hidden">
                            <div id="achievements-score-bar" class="h-full rounded-full bg-white" style="width: 0%">
                            </div>
                        </div>
                    </div>

                    <div
                        class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 shadow-sm">
                        <div class="text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">In
                            Progress
                        </div>
                        <div id="achievements-progress-count"
                            class="mt-2 text-3xl font-bold text-slate-800 dark:text-white">0</div>
                        <div class="mt-1 text-sm text-slate-500 dark:text-slate-400">Still active</div>
                    </div>

                    <div
                        class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 shadow-sm">
                        <div class="text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                            Completed
                        </div>
                        <div id="achievements-completed-count"
                            class="mt-2 text-3xl font-bold text-slate-800 dark:text-white">0</div>
                        <div class="mt-1 text-sm text-slate-500 dark:text-slate-400">Unlocked</div>
                    </div>
                </div>
            </div>

            <div class="px-4 pt-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
                <div class="flex rounded-2xl bg-slate-100 dark:bg-slate-950 p-1">
                    <button onclick="app.setAchievementsTab('in-progress')" id="atab-in-progress"
                        class="flex-1 py-2.5 text-sm font-semibold rounded-xl border border-transparent text-slate-500 dark:text-slate-400 transition">In
                        progress</button>
                    <button onclick="app.setAchievementsTab('completed')" id="atab-completed"
                        class="flex-1 py-2.5 text-sm font-semibold rounded-xl border border-transparent text-slate-500 dark:text-slate-400 transition">Completed</button>
                </div>
            </div>

            <div id="achievements-modal-content"
                class="flex-1 overflow-y-auto p-4 hide-scrollbar bg-slate-50 dark:bg-slate-950/50">
            </div>
        </div>
    </div>

    <!-- GROWTH MODAL (Bottom Sheet) -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-[45] hidden transition-opacity"
        onclick="app.closeModal()"></div>
    <div id="growth-modal"
        class="fixed bottom-0 left-0 right-0 max-w-3xl mx-auto bg-white dark:bg-slate-900 rounded-t-3xl border-t border-slate-200 dark:border-slate-700 z-50 flex flex-col h-[85vh] modal-closed shadow-2xl transition-colors duration-300">
        <div class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center space-x-3">
                <div id="modal-icon" class="p-2 rounded-xl text-white"><i data-lucide="circle" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 id="modal-title" class="text-xl font-bold text-slate-800 dark:text-white">Pillar</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Manage structure</p>
                </div>
            </div>
            <button onclick="app.closeModal()"
                class="w-8 h-8 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition"><i
                    data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="flex border-b border-slate-200 dark:border-slate-800 shrink-0">
            <button onclick="app.setModalTab('goals')" id="mtab-goals"
                class="flex-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent focus:outline-none">Goals</button>
            <button onclick="app.setModalTab('tasks')" id="mtab-tasks"
                class="flex-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent focus:outline-none">Tasks</button>
            <button onclick="app.setModalTab('achievements')" id="mtab-achievements"
                class="flex-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent focus:outline-none">Achievements</button>
        </div>

        <div id="modal-content" class="flex-1 overflow-y-auto p-4 hide-scrollbar bg-slate-50 dark:bg-slate-950/50">
        </div>
    </div>

    <!-- STREAK INSIGHTS MODAL -->
    <div id="streak-insights-modal"
        class="fixed inset-0 bg-black/50 dark:bg-black/80 z-[70] hidden flex items-center justify-center p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl transform scale-95 insights-box transition-transform duration-200"
            id="streak-insights-box">
            <div
                class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950/50">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="flame" class="w-5 h-5 text-orange-500 dark:text-orange-400"></i> Streak Insights
                </h3>
                <button type="button" onclick="app.closeStreakInsights()"
                    class="text-slate-500 hover:text-slate-800 dark:hover:text-white p-1 transition"><i data-lucide="x"
                        class="w-5 h-5"></i></button>
            </div>
            <div id="streak-insights-content" class="p-5 space-y-4"></div>
        </div>
    </div>

    <!-- TASK INSIGHTS MODAL -->
    <div id="task-insights-modal"
        class="fixed inset-0 bg-black/50 dark:bg-black/80 z-[70] hidden flex items-center justify-center p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl transform scale-95 insights-box transition-transform duration-200"
            id="task-insights-box">
            <div
                class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950/50">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500 dark:text-emerald-400"></i> Task
                    Completion Insights
                </h3>
                <button type="button" onclick="app.closeTaskInsights()"
                    class="text-slate-500 hover:text-slate-800 dark:hover:text-white p-1 transition"><i data-lucide="x"
                        class="w-5 h-5"></i></button>
            </div>
            <div id="task-insights-content" class="p-5 space-y-4"></div>
        </div>
    </div>

    <!-- TASK COMPLETION DETAIL MODAL -->
    <div id="completion-detail-modal"
        class="fixed inset-0 bg-black/50 dark:bg-black/80 z-[70] hidden flex items-center justify-center p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div id="completion-detail-box"
            class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200">
            <div
                class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950/50">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white">Completion details</h3>
                <button type="button" onclick="app.closeCompletionDetailModal()"
                    class="text-slate-500 hover:text-slate-800 dark:hover:text-white p-1 transition"><i data-lucide="x"
                        class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <textarea id="completion-detail-input" rows="5"
                    class="w-full resize-y bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-white"
                    placeholder="What did you complete? (optional)"></textarea>
                <div class="flex justify-end gap-3"><button type="button" onclick="app.closeCompletionDetailModal()"
                        class="text-sm text-slate-500">Cancel</button><button type="button"
                        onclick="app.saveCompletionDetail()"
                        class="rounded-lg bg-emerald-600 hover:bg-emerald-500 px-4 py-2 text-sm font-semibold text-white">Save
                        detail</button></div>
            </div>
        </div>
    </div>

    <div id="morning-toast" role="status" aria-live="polite"
        class="fixed bottom-6 left-1/2 z-[80] hidden w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 translate-y-3 rounded-xl bg-slate-900 px-4 py-3 text-center text-sm font-medium text-white shadow-xl opacity-0 transition-all duration-200 dark:bg-white dark:text-slate-900">
    </div>

    <script>
        const PILLARS = [
            { id: 'health', name: 'Health', icon: 'heart', color: 'bg-rose-500', text: 'text-rose-500 dark:text-rose-400' },
            { id: 'knowledge', name: 'Knowledge', icon: 'brain', color: 'bg-blue-500', text: 'text-blue-500 dark:text-blue-400' },
            { id: 'career', name: 'Career', icon: 'briefcase', color: 'bg-amber-500', text: 'text-amber-500 dark:text-amber-400' },
            { id: 'wealth', name: 'Wealth', icon: 'wallet', color: 'bg-emerald-500', text: 'text-emerald-500 dark:text-emerald-400' },
            { id: 'relationship', name: 'Relationship', icon: 'users', color: 'bg-pink-500', text: 'text-pink-500 dark:text-pink-400' },
            { id: 'spirituality', name: 'Spirituality', icon: 'sparkles', color: 'bg-violet-500', text: 'text-violet-500 dark:text-violet-400' },
            { id: 'lifestyle', name: 'Lifestyle', icon: 'compass', color: 'bg-cyan-500', text: 'text-cyan-500 dark:text-cyan-400' }
        ];

        const EMOJIS = ['😫', '😕', '😐', '🙂', '😌', '🤩', '🔥'];
        const MORNING_MESSAGES = [
            'Go gently today—small steps still count.',
            'Be kind to yourself. You don’t need to have it all figured out.',
            'A steady start can become a meaningful day.',
            'You’re in a good place—carry that energy forward.',
            'Calm focus looks good on you. Keep it simple.',
            'Great energy—put it toward what matters most.',
            'You’re on fire—make today count!'
        ];

        const DATA_DB_NAME = 'arise-storage';
        const DATA_DB_VERSION = 1;
        const DATA_STORE_NAME = 'app-data';
        const DATA_KEY = 'life_os_v6';

        const createDefaultData = () => {
            const data = { userName: 'Explorer', pillars: {}, tasks: [], taskCompletions: {}, taskProgress: {}, journal: [], mood: {} };
            PILLARS.forEach(p => { data.pillars[p.id] = { goals: [], achievements: [] }; });
            return data;
        };

        const openDataDb = () => new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) {
                reject(new Error('IndexedDB is not supported in this browser.'));
                return;
            }

            const request = indexedDB.open(DATA_DB_NAME, DATA_DB_VERSION);

            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(DATA_STORE_NAME)) {
                    db.createObjectStore(DATA_STORE_NAME);
                }
            };

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error('Failed to open IndexedDB.'));
        });

        const readStoredData = async () => {
            const db = await openDataDb();
            try {
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(DATA_STORE_NAME, 'readonly');
                    const store = tx.objectStore(DATA_STORE_NAME);
                    const request = store.get(DATA_KEY);

                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error || new Error('Failed to read IndexedDB data.'));
                });
            } finally {
                db.close();
            }
        };

        const writeStoredData = async (data) => {
            const db = await openDataDb();
            try {
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(DATA_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(DATA_STORE_NAME);
                    store.put(data, DATA_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error || new Error('Failed to write IndexedDB data.'));
                    tx.onabort = () => reject(tx.error || new Error('IndexedDB write aborted.'));
                });
            } finally {
                db.close();
            }
        };

        const deleteStoredData = async () => {
            const db = await openDataDb();
            try {
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(DATA_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(DATA_STORE_NAME);
                    store.delete(DATA_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error || new Error('Failed to delete IndexedDB data.'));
                    tx.onabort = () => reject(tx.error || new Error('IndexedDB delete aborted.'));
                });
            } finally {
                db.close();
            }
        };

            },

            formatDisplayDate(dateStr) {
                const date = this.parseDateString(dateStr);
                return date.toLocaleDateString(undefined, {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });
            },

            getActivityDatesSet() {
                const activeDatesSet = new Set();
                Object.values(this.data.taskCompletions).forEach(dates => dates.forEach(d => activeDatesSet.add(d)));
                return activeDatesSet;
            },

            getGlobalActivityStreak(referenceDateStr = this.currentDate) {
                const activeDatesSet = this.getActivityDatesSet();
                if (activeDatesSet.size === 0) return 0;

                let streak = 0;
                let checkDate = this.parseDateString(referenceDateStr);
                const checkDateStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;

                if (!activeDatesSet.has(checkDateStr)) {
                    checkDate.setDate(checkDate.getDate() - 1);
                }

                for (let i = 0; i < 1000; i++) {
                    const dStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
                    if (activeDatesSet.has(dStr)) {
                        streak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        break;
                    }
                }

                return streak;
            },

            getTaskCompletionStats(referenceDateStr = this.currentDate) {
                const visibleTasks = this.data.tasks.filter(t => this.shouldShowTask(t, referenceDateStr));
                const completedToday = visibleTasks.filter(t => this.isTaskCompleted(t.id, referenceDateStr)).length;
                const totalCompletions = Object.values(this.data.taskCompletions).reduce((sum, dates) => sum + dates.length, 0);
                const tasksWithCompletions = Object.values(this.data.taskCompletions).filter(dates => dates.length > 0).length;

                return {
                    visibleTasks,
                    completedToday,
                    pendingToday: Math.max(visibleTasks.length - completedToday, 0),
                    totalCompletions,
                    tasksWithCompletions
                };
            },

            getDailyPerformanceInsight(completedToday, totalVisibleTasks) {
                const score = totalVisibleTasks > 0 ? Math.round((completedToday / totalVisibleTasks) * 100) : 0;

                if (score >= 100) {
                    return { score, label: '🌞 Sunshine Day', meaning: 'Perfectly intentional day.' };
                }
                if (score >= 85) {
                    return { score, label: '⭐ Excellent', meaning: 'Outstanding consistency.' };
                }
                if (score >= 69) {
                    return { score, label: '💪 Great', meaning: 'Strong progress.' };
                }
                if (score >= 54) {
                    return { score, label: '👍 Good', meaning: 'Productive day.' };
                }
                if (score >= 38) {
                    return { score, label: '⚠️ Recovery Needed', meaning: 'Needs improvement.' };
                }
                return { score, label: '🔄 Reset Tomorrow', meaning: 'Fresh start tomorrow.' };
            },

            getStreakMilestone(streak) {
                const milestones = [
                    { days: 365, badge: '👑 Sunshine Master' },
                    { days: 180, badge: '🏔 Half-Year Legend' },
                    { days: 100, badge: '💎 Century Club' },
                    { days: 75, badge: '🚀 Momentum Master' },
                    { days: 50, badge: '⭐ Consistency Star' },
                    { days: 30, badge: '🌞 Monthly Champion' },
                    { days: 21, badge: '🌿 Habit Builder' },
                    { days: 14, badge: '💪 Two Week Warrior' },
                    { days: 7, badge: '🔥 One Week Strong' },
                    { days: 3, badge: '🌱 Getting Started' }
                ];

                const milestone = milestones.find(item => streak >= item.days);
                return milestone || { days: 0, badge: 'Build your first streak', label: 'No milestone yet' };
            },

            getMilestoneText(streak, completedToday, totalVisibleTasks) {

                            <div class="text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">Latest activity</div>
                            <div class="mt-2 text-lg font-semibold text-slate-800 dark:text-white">${latestActivityLabel}</div>

                            <div class="text-xs font-semibold uppercase tracking-wider text-orange-600 dark:text-orange-300">Milestone Insight</div>
                        <!--    <p class="text-sm text-slate-700 dark:text-slate-200 leading-6"><span class="font-semibold">Daily Performance:</span> ${milestoneText.performanceText}</p>  -->
                            <p class="text-sm text-slate-700 dark:text-slate-200 leading-6"><span class="font-semibold">Consistency Streak:</span> ${milestoneText.streakText}</p>
                        </div>
                    <!--    <div class="rounded-2xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 p-4 space-y-2">

            renderTaskInsights() {

            async loadData() {
                try {
                    const saved = await readStoredData();
                    this.data = saved ? this.normalizeData(saved) : createDefaultData();
                } catch (err) {
                    this.data = createDefaultData();
                }
            },

            normalizeData(data) {
                const normalized = { ...createDefaultData(), ...data };
                normalized.pillars = normalized.pillars || {};
                PILLARS.forEach(p => {
                    if (!normalized.pillars[p.id]) normalized.pillars[p.id] = { goals: [], achievements: [] };
                    if (!normalized.pillars[p.id].goals) normalized.pillars[p.id].goals = [];
                    if (!normalized.pillars[p.id].achievements) normalized.pillars[p.id].achievements = [];
                });
                normalized.tasks = Array.isArray(normalized.tasks) ? normalized.tasks : [];
                normalized.taskCompletions = normalized.taskCompletions && typeof normalized.taskCompletions === 'object' ? normalized.taskCompletions : {};
                normalized.taskProgress = normalized.taskProgress && typeof normalized.taskProgress === 'object' ? normalized.taskProgress : {};
                normalized.journal = Array.isArray(normalized.journal) ? normalized.journal : [];
                normalized.mood = normalized.mood && typeof normalized.mood === 'object' ? normalized.mood : {};
                normalized.userName = normalized.userName || 'Explorer';
                return normalized;
            },

            async migrateData() {
                this.data = this.normalizeData(this.data);
                if (!this.data.userName) this.data.userName = 'Explorer';
                if (!this.data.taskCompletions) this.data.taskCompletions = {};
                if (!this.data.taskProgress) this.data.taskProgress = {};
                if (!this.data.mood) this.data.mood = {};

                this.data.tasks.forEach(t => {
                    if (!t.frequency) {
                        t.frequency = 'once';
                        t.startDate = t.date || this.currentDate;
                        if (t.completed && t.date) {
                            if (!this.data.taskCompletions[t.id]) this.data.taskCompletions[t.id] = [];
                            if (!this.data.taskCompletions[t.id].includes(t.date)) this.data.taskCompletions[t.id].push(t.date);
                        }
                    }
                });
                await this.saveData();
            },

            async saveData() {
                this.data = this.normalizeData(this.data);
                try {
                    await writeStoredData(this.data);
                } catch (err) {
                    console.error('Failed to save data to IndexedDB.', err);
                }
                this.updateHeaderStats();
            },

            changeDate(newDate) {
                if (!newDate) return;
                this.currentDate = newDate;
                this.updateHeaderStats();
                this.render();
            },

            changeDateOffset(days) {
                const d = this.parseDateString(this.currentDate);
                d.setDate(d.getDate() + days);
                const newDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                document.getElementById('date-picker').value = newDate;
                this.changeDate(newDate);
            },

            // --- THEME ---
            toggleTheme() {
                const htmlClasses = document.documentElement.classList;
                if (htmlClasses.contains('dark')) {
                    htmlClasses.remove('dark');
                } else {
                    htmlClasses.add('dark');
                }
                this.updateThemeControl();
                lucide.createIcons();
                // Re-render chart if on progress tab to match new colors
                if (this.currentTab === 'progress') this.renderProgress(document.getElementById('main-content'));
            },

            updateThemeControl() {
                const isDark = document.documentElement.classList.contains('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                document.getElementById('theme-mode').textContent = isDark ? 'Dark' : 'Light';

            openProfile() {

                modal.classList.remove('hidden');

                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');

                const box = document.getElementById('profile-box');
                modal.classList.add('opacity-0');
                box.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 200);

                const modal = document.getElementById('achievements-modal');
                const box = document.getElementById('achievements-box');
                modal.classList.remove('hidden');

                requestAnimationFrame(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');

                this.setAchievementsTab('in-progress');

                const modal = document.getElementById('achievements-modal');
                const box = document.getElementById('achievements-box');
                modal.classList.add('opacity-0');
                box.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 200);
            },

            setAchievementsTab(tabId) {
                this.activeAchievementsTab = tabId;

                ['in-progress', 'completed'].forEach(t => {
                    const el = document.getElementById(`atab-${t}`);
                    if (!el) return;
                    if (t === tabId) {
                        el.classList.add('bg-white', 'dark:bg-slate-900', 'text-emerald-500', 'dark:text-emerald-400', 'shadow-sm');
                        el.classList.remove('text-slate-500', 'dark:text-slate-400');
                    } else {
                        el.classList.remove('bg-white', 'dark:bg-slate-900', 'text-emerald-500', 'dark:text-emerald-400', 'shadow-sm');
                        el.classList.add('text-slate-500', 'dark:text-slate-400');
                    }
                });

                this.renderAchievementsOverview();
                lucide.createIcons();
            },

            getAllAchievements() {
                const items = [];

                PILLARS.forEach(p => {
                    const pillar = this.data.pillars[p.id] || { achievements: [] };
                    (pillar.achievements || []).forEach(a => {
                        const progress = this.getAchievementProgress(a);
                        items.push({
                            ...a,
                            pillarId: p.id,
                            pillarName: p.name,
                            pillarText: p.text,
                            completed: progress.completed,
                            progressText: progress.progressText,
                            progressValue: progress.progressValue
                        });
                    });
                });

                return items;
            },

            getAchievementProgress(achievement) {
                if (achievement.type === 'streak' && achievement.taskId) {
                    const target = Number.isFinite(achievement.target) && achievement.target > 0 ? achievement.target : 0;
                    const currentTaskStreak = this.getTaskStreak(achievement.taskId, this.currentDate);
                    const completed = target > 0 ? currentTaskStreak >= target : false;

                    return {
                        completed,
                        progressText: `Streak Progress: ${currentTaskStreak} / ${target || 0}`,
                        progressValue: target > 0 ? Math.min((currentTaskStreak / target) * 100, 100) : 0
                    };
                }

                const completed = Boolean(achievement.completed);
                return {
                    completed,
                    progressText: completed ? 'Completed' : 'Manual unlock',
                    progressValue: completed ? 100 : 0
                };
            },

            renderAchievementItem(item) {
                const statusColor = item.completed ? 'border-emerald-500/40 bg-emerald-500/5' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900';
                const statusIcon = item.completed ? 'check' : item.type === 'streak' ? 'trophy' : 'circle';
                const statusIconWrap = item.completed ? 'bg-emerald-500 border-emerald-500 text-white dark:text-slate-950' : 'border-slate-300 dark:border-slate-600 text-slate-400 dark:text-slate-500';
                const textColor = item.completed ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-200';
                const metaColor = item.completed ? 'text-emerald-500 dark:text-emerald-400' : 'text-slate-500 dark:text-slate-400';

            exportData() {

            async downloadIndexedDbData() {
                try {
                    const stored = await readStoredData();
                    const data = stored ? this.normalizeData(stored) : createDefaultData();
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ARISE_IndexedDB_${this.currentDate}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                } catch (err) {
                    alert('Unable to download IndexedDB data.');
                }

            importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.pillars) {
                            this.data = parsed;
                            this.saveData();
                            this.closeProfile();
                            this.render();
                            alert("Data imported successfully!");
                        } else throw new Error();
                    } catch (err) {
                        alert("Invalid backup file.");
                    }
                };
                reader.readAsText(file);
            },

            // --- DATE & TASK LOGIC ---
            parseDateString(dateStr) {
                const [y, m, d] = dateStr.split('-');
                return new Date(y, m - 1, d);
            },

            dateToString(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            },

            getWeekStart(date) {
                const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                start.setDate(start.getDate() - start.getDay());
                return start;
            },

            getPeriodTaskStats(startDate, days = 7, pillarId = null) {
                let scheduled = 0, completed = 0;
                for (let i = 0; i < days; i++) {
                    const d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
                    const dateStr = this.dateToString(d);
                    this.data.tasks.filter(t => (!pillarId || t.pillar === pillarId) && this.shouldShowTask(t, dateStr)).forEach(t => {
                        scheduled++;
                        if (this.isTaskCompleted(t.id, dateStr)) completed++;
                    });
                }
                return { scheduled, completed, rate: scheduled ? Math.round((completed / scheduled) * 100) : 0 };
            },

            getTaskLifetimeStats(task, referenceDateStr = this.currentDate) {
                const referenceDate = this.parseDateString(referenceDateStr);
                const startDate = this.parseDateString(task.startDate);
                let shown = 0;

                if (startDate <= referenceDate) {
                    for (let d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()); d <= referenceDate; d.setDate(d.getDate() + 1)) {
                        if (this.shouldShowTask(task, this.dateToString(d))) shown++;
                    }
                }

                const completed = (this.data.taskCompletions[task.id] || []).filter(dateStr => {
                    const completionDate = this.parseDateString(dateStr);
                    return completionDate <= referenceDate;
                }).length;

                return {
                    shown,
                    completed,
                    rate: shown ? Math.round((completed / shown) * 100) : 0
                };
            },

            getTaskDetailStats(task, referenceDateStr = this.currentDate) {
                const referenceDate = this.parseDateString(referenceDateStr);
                const startDate = this.parseDateString(task.startDate);
                const todayStr = this.currentDate;
                let scheduled = 0;
                let completed = 0;
                let missed = 0;
                let currentStreak = 0;
                let bestStreak = 0;

                for (let d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()); d <= referenceDate; d.setDate(d.getDate() + 1)) {
                    const dateStr = this.dateToString(d);
                    if (!this.shouldShowTask(task, dateStr)) continue;

                    scheduled++;
                    const isCompleted = this.isTaskCompleted(task.id, dateStr);
                    const isPendingToday = dateStr === todayStr && dateStr === referenceDateStr && !isCompleted;

                    if (isCompleted) {
                        completed++;
                        currentStreak++;
                        bestStreak = Math.max(bestStreak, currentStreak);
                    } else if (isPendingToday) {
                        bestStreak = Math.max(bestStreak, currentStreak);
                    } else {
                        missed++;
                        currentStreak = 0;
                    }
                }

                return {
                    scheduled,
                    completed,
                    missed,
                    rate: scheduled ? Math.round((completed / scheduled) * 100) : 0,
                    currentStreak,
                    bestStreak,
                    startDateLabel: this.formatDisplayDate(task.startDate),
                    frequencyLabel: (task.frequency || 'once').charAt(0).toUpperCase() + (task.frequency || 'once').slice(1)
                };
            },

            renderTaskHeatmap(task) {
                const referenceDate = this.parseDateString(this.currentDate);
                const month = new Date(referenceDate.getFullYear(), referenceDate.getMonth() + this.taskHeatmapMonthOffset, 1);
                const firstGridDay = new Date(month.getFullYear(), month.getMonth(), 1 - month.getDay());
                const todayStr = this.currentDate;
                const weeks = [];

                for (let row = 0; row < 6; row++) {
                    const week = [];
                    for (let col = 0; col < 7; col++) {
                        const day = new Date(firstGridDay.getFullYear(), firstGridDay.getMonth(), firstGridDay.getDate() + (row * 7) + col);
                        const dateStr = this.dateToString(day);
                        const inMonth = day.getMonth() === month.getMonth();
                        const scheduled = inMonth && this.shouldShowTask(task, dateStr);
                        const completed = scheduled && this.isTaskCompleted(task.id, dateStr);
                        const isFuture = dateStr > todayStr;
                        const isBeforeStart = this.parseDateString(dateStr) < this.parseDateString(task.startDate);

                        let cellClass = 'border-transparent bg-transparent text-slate-400 dark:text-slate-600';

                        if (!inMonth || isBeforeStart || !scheduled || isFuture) {
                            cellClass = 'border-transparent bg-transparent text-slate-300 dark:text-slate-700';
                        } else if (completed) {
                            cellClass = 'border-emerald-500/40 bg-emerald-500/20 text-emerald-950 dark:text-emerald-50';
                        } else {
                            cellClass = 'border-rose-500/35 bg-rose-500/15 text-rose-900 dark:text-rose-50';
                        }

                        week.push(`
                            <div title="${dateStr}"
                                class="aspect-square rounded-lg border ${cellClass} flex items-center justify-center transition-colors duration-300">
                                <span class="text-[10px] leading-none font-semibold">${day.getDate()}</span>
                            </div>
                        `);
                    }
                    weeks.push(week.join(''));
                }

                return `
                    <div class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 p-3 space-y-3">
                        <div class="flex items-center justify-between gap-3">
                            <div>
                                <div class="text-sm font-semibold text-slate-800 dark:text-white">Task heat map</div>
                                <div class="text-[11px] text-slate-500 dark:text-slate-400">${month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div>
                            </div>
                            <div class="flex gap-1">
                                <button type="button" onclick="app.changeTaskHeatmapMonth(-1)" title="Previous month" class="p-1.5 rounded-lg text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/50 transition"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
                                <button type="button" onclick="app.changeTaskHeatmapMonth(1)" title="Next month" class="p-1.5 rounded-lg text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/50 transition"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </div>
                        <div>
                            <div class="grid grid-cols-7 gap-0.5">
                                ${weeks.join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

                this.taskHeatmapMonthOffset += offset;
                this.renderGrowth(document.getElementById('main-content'));
                requestAnimationFrame(() => lucide.createIcons());
            },

            getMoodTrend(startDate, days = 7) {
                const values = { '😫': 1, '😕': 2, '😐': 3, '🙂': 4, '😌': 4, '🤩': 5, '🔥': 5 };
                const entries = [];
                for (let i = 0; i < days; i++) {
                    const d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
                    const mood = this.data.mood[this.dateToString(d)]?.emoji;
                    entries.push(values[mood] || null);
                }
                const recorded = entries.filter(value => value !== null);
                if (!recorded.length) return { entries, label: 'No mood check-ins', average: null };
                const delta = recorded[recorded.length - 1] - recorded[0];
                const average = recorded.reduce((sum, value) => sum + value, 0) / recorded.length;
                const label = delta > 0 ? 'Improving' : delta < 0 ? 'Declining' : 'Steady';
                return { entries, label, average };
            },

            getMoodTrendChart(startDate) {
                const trend = this.getMoodTrend(startDate);
                const labels = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
                const points = trend.entries.map((value, index) => value === null ? '' : `${index * (100 / 6)},${100 - ((value - 1) / 4) * 82 - 9}`).filter(Boolean).join(' ');
                const dots = trend.entries.map((value, index) => value === null ? '' : `<circle cx="${index * (100 / 6)}" cy="${100 - ((value - 1) / 4) * 82 - 9}" r="3.5" class="fill-emerald-500 stroke-white dark:stroke-slate-900" stroke-width="2" />`).join('');
                return `<div class="mt-2"><svg viewBox="-4 -4 108 108" class="w-full h-16 overflow-visible" preserveAspectRatio="none" aria-label="Mood trend graph"><path d="M0 9H100 M0 50H100 M0 91H100" class="stroke-slate-200 dark:stroke-slate-700" stroke-width="1" /><polyline points="${points}" fill="none" class="stroke-emerald-500" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />${dots}</svg><div class="grid grid-cols-7 text-center text-[9px] text-slate-400">${labels.map(label => `<span>${label}</span>`).join('')}</div><div class="mt-1 text-[11px] text-slate-500">${trend.average === null ? trend.label : `${trend.label} · ${trend.average.toFixed(1)}/5`}</div></div>`;
            },

            shouldShowTask(task, dateStr) {
                const targetDate = this.parseDateString(dateStr);
                const startDate = this.parseDateString(task.startDate);

                targetDate.setHours(0, 0, 0, 0);
                startDate.setHours(0, 0, 0, 0);

                if (targetDate < startDate) return false;

                const diffTime = Math.abs(targetDate - startDate);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const targetDayOfWeek = targetDate.getDay();

                switch (task.frequency) {
                    case 'once': return dateStr === task.startDate;
                    case 'daily': return true;
                    case 'weekly': return targetDate.getDay() === startDate.getDay();
                    case 'biweekly':
                        const weeksDiff = Math.floor(diffDays / 7);
                        return (targetDate.getDay() === startDate.getDay()) && (weeksDiff % 2 === 0);
                    case 'monthly': return targetDate.getDate() === startDate.getDate();
                    case 'custom': return task.customDays && task.customDays.includes(targetDayOfWeek);
                    default: return false;
                }
            },

            isTaskCompleted(taskId, dateStr) {
                return this.data.taskCompletions[taskId] && this.data.taskCompletions[taskId].includes(dateStr);
            },

            toggleTaskCompletion(taskId, dateStr) {
                if (!this.data.taskCompletions[taskId]) this.data.taskCompletions[taskId] = [];
                const idx = this.data.taskCompletions[taskId].indexOf(dateStr);

                if (idx > -1) this.data.taskCompletions[taskId].splice(idx, 1);
                else this.data.taskCompletions[taskId].push(dateStr);
                if (idx > -1 && this.data.taskProgress[taskId] && this.data.taskProgress[taskId][dateStr]) {
                    delete this.data.taskProgress[taskId][dateStr].completionNote;
                }

                this.saveData();
            },

            getTaskProgress(taskId, dateStr = this.currentDate) {
                return (this.data.taskProgress[taskId] && this.data.taskProgress[taskId][dateStr]) || {};
            },

            setTaskProgress(taskId, field, value) {
                const task = this.data.tasks.find(t => t.id === taskId);
                if (!task || !['slider', 'counter'].includes(field)) return;
                let numericValue = Number(value);
                if (!Number.isFinite(numericValue)) return;
                numericValue = Math.max(0, Math.round(numericValue));
                if (!this.data.taskProgress[taskId]) this.data.taskProgress[taskId] = {};
                if (!this.data.taskProgress[taskId][this.currentDate]) this.data.taskProgress[taskId][this.currentDate] = {};
                this.data.taskProgress[taskId][this.currentDate][field] = numericValue;
                this.saveData();
                this.renderToday(document.getElementById('main-content'));
                lucide.createIcons();
            },

            adjustTaskProgress(taskId, field, delta) {
                const current = this.getTaskProgress(taskId)[field] || 0;
                this.setTaskProgress(taskId, field, current + delta);
            },

            setTaskSliderPercent(taskId, percent) {
                const task = this.data.tasks.find(t => t.id === taskId);
                if (!task || !task.hasSlider) return;
                const target = Number(task.sliderTarget) || 0;
                const boundedPercent = Math.max(0, Math.min(100, Number(percent) || 0));
                this.setTaskProgress(taskId, 'slider', Math.round((boundedPercent / 100) * target));
            },

            handleTaskCheckbox(taskId) {
                this.toggleTaskFromToday(taskId);
            },

            openCompletionDetailModal(taskId) {
                if (!this.isTaskCompleted(taskId, this.currentDate)) return;
                this.completionDetailTaskId = taskId;
                document.getElementById('completion-detail-input').value = this.getTaskProgress(taskId).completionNote || '';
                const modal = document.getElementById('completion-detail-modal');
                const box = document.getElementById('completion-detail-box');
                modal.classList.remove('hidden');
                requestAnimationFrame(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); });
                lucide.createIcons();
            },

            closeCompletionDetailModal() {
                const modal = document.getElementById('completion-detail-modal');
                const box = document.getElementById('completion-detail-box');
                modal.classList.add('opacity-0'); box.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 200);
                this.completionDetailTaskId = null;
            },

            saveCompletionDetail() {
                const taskId = this.completionDetailTaskId;
                if (!taskId || !this.isTaskCompleted(taskId, this.currentDate)) return;
                if (!this.data.taskProgress[taskId]) this.data.taskProgress[taskId] = {};
                if (!this.data.taskProgress[taskId][this.currentDate]) this.data.taskProgress[taskId][this.currentDate] = {};
                this.data.taskProgress[taskId][this.currentDate].completionNote = document.getElementById('completion-detail-input').value.trim();
                this.saveData();
                this.closeCompletionDetailModal();
                this.renderToday(document.getElementById('main-content'));
                lucide.createIcons();
            },

            updateHeaderStats() {
                const taskStats = this.getTaskCompletionStats(this.currentDate);
                const headerTasks = document.getElementById('header-tasks');
                if (headerTasks) headerTasks.innerText = `${taskStats.completedToday}/${taskStats.visibleTasks.length}`;

                const streak = this.getGlobalActivityStreak(this.currentDate);
                const headerStreak = document.getElementById('header-streak');
                if (headerStreak) headerStreak.innerText = streak;
            },

            getTaskStreak(taskId, referenceDateStr) {
                const task = this.data.tasks.find(t => t.id === taskId);
                if (!task) return 0;
                const completions = this.data.taskCompletions[taskId] || [];
                if (completions.length === 0) return 0;

                let streak = 0;
                let checkDate = this.parseDateString(referenceDateStr);
                let foundFirst = false;
                const taskStart = this.parseDateString(task.startDate);

                for (let i = 0; i < 1000; i++) {
                    if (checkDate < taskStart) break;

                    const dStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;

                    if (this.shouldShowTask(task, dStr)) {
                        const isCompleted = completions.includes(dStr);

                        if (!foundFirst) {
                            foundFirst = true;
                            if (!isCompleted && dStr === referenceDateStr) {
                                // Missing today does not break the streak yet, as the day is still ongoing
                            } else if (isCompleted) {
                                streak++;
                            } else {
                                break; // Missed a past required day -> streak broken
                            }
                        } else {
                            if (isCompleted) {
                                streak++;
                            } else {
                                break; // Streak broken
                            }
                        }
                    }
                    checkDate.setDate(checkDate.getDate() - 1);
                }
                return streak;
            },

            switchTab(tabId) {
                this.currentTab = tabId;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-emerald-500', 'dark:text-emerald-400');
                    btn.classList.add('text-slate-400');
                });
                if (tabId !== 'indexeddb') {
                    const activeBtn = document.getElementById(`nav-${tabId}`);
                    if (activeBtn) {
                        activeBtn.classList.remove('text-slate-400');
                        activeBtn.classList.add('text-emerald-500', 'dark:text-emerald-400');
                    }
                }
                this.render();
            },

            render() {
                const main = document.getElementById('main-content');
                main.innerHTML = '';
                if (this.currentTab === 'today') this.renderToday(main);
                else if (this.currentTab === 'growth') this.renderGrowth(main);
                else if (this.currentTab === 'progress') this.renderProgress(main);
                else if (this.currentTab === 'journal') this.renderJournal(main);
                else if (this.currentTab === 'indexeddb') this.renderIndexedDbPage(main);
                lucide.createIcons();
            },

                    </div>

                `;

                            <p class="text-slate-500 dark:text-slate-400 text-sm">No tasks scheduled for this date.</p>
                        </div>
                    `;
                } else {
                    html += `<div class="space-y-4">`;

                        const pTasks = visibleTasks.filter(t => t.pillar === p.id);
                        if (pTasks.length > 0) {
                            html += `
                                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm transition-colors duration-300">
                                    <div class="flex items-center space-x-2 mb-3">
                                        <div class="w-2 h-2 rounded-full ${p.color}"></div>
                                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">${p.name}</h3>
                                    </div>
                                    <div class="space-y-2">
                            `;
                            pTasks.forEach(t => {
                                const isDone = this.isTaskCompleted(t.id, this.currentDate);
                                const progress = this.getTaskProgress(t.id, this.currentDate);
                                let goalText = '';
                                if (t.goalId) {
                                    const goal = this.data.pillars[p.id].goals.find(g => g.id === t.goalId);
                                    if (goal) goalText = `<p class="text-[10px] text-slate-500 mt-0.5 flex items-center gap-1"><i data-lucide="target" class="w-3 h-3"></i> ${this.escapeHTML(goal.text)}</p>`;
                                }
                                const completionNote = progress.completionNote || '';
                                const completionNoteText = isDone && completionNote ? `<p class="text-xs leading-5 text-slate-500 dark:text-slate-400 mt-1 whitespace-pre-wrap">${this.escapeHTML(completionNote)}</p>` : '';
                                const completionDetailButton = isDone ? `<button type="button" onclick="app.openCompletionDetailModal('${t.id}')" class="mt-2 text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:text-emerald-500">${completionNote ? 'Edit completion detail' : 'Add completion detail'}</button>` : '';
                                const sliderValue = Math.round(Number(progress.slider) || 0);
                                const counterValue = Math.round(Number(progress.counter) || 0);
                                const sliderTarget = Math.max(1, Math.round(Number(t.sliderTarget) || 0));
                                const counterTarget = Math.max(1, Math.round(Number(t.counterTarget) || 0));
                                const sliderBarValue = Math.min(100, Math.round((sliderValue / sliderTarget) * 100));
                                const sliderProgress = t.hasSlider ? `<div class="mt-3"><div class="flex justify-between text-[10px] text-slate-500 mb-1"><span>Slider progress</span><span class="${sliderValue >= sliderTarget ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : ''}">${sliderValue} / ${sliderTarget}${sliderValue >= sliderTarget ? ' · target reached' : ''}</span></div><div class="flex items-center gap-2"><input type="range" min="0" max="100" step="1" value="${sliderBarValue}" oninput="app.setTaskSliderPercent('${t.id}', this.value)" class="flex-1 accent-emerald-500"><input type="number" min="0" step="1" value="${sliderValue}" onchange="app.setTaskProgress('${t.id}', 'slider', this.value)" class="w-20 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-2 py-1 text-xs text-slate-800 dark:text-white"></div></div>` : '';
                                const counterProgress = t.hasCounter ? `<div class="mt-3"><div class="flex justify-between text-[10px] text-slate-500 mb-1"><span>Count</span><span class="${counterValue >= counterTarget ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : ''}">${counterValue} / ${counterTarget}${counterValue >= counterTarget ? ' · target reached' : ''}</span></div><div class="flex items-center gap-2"><button type="button" onclick="app.adjustTaskProgress('${t.id}', 'counter', -1)" class="w-7 h-7 rounded border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300">−</button><input type="number" min="0" step="1" value="${counterValue}" onchange="app.setTaskProgress('${t.id}', 'counter', this.value)" class="w-20 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-2 py-1 text-xs text-slate-800 dark:text-white"><button type="button" onclick="app.adjustTaskProgress('${t.id}', 'counter', 1)" class="w-7 h-7 rounded border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300">+</button></div></div>` : '';

                                html += `
                                    <div class="flex items-start space-x-3 p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800/80 transition-colors duration-300">
                                        <button onclick="app.handleTaskCheckbox('${t.id}')" class="mt-0.5 w-5 h-5 rounded border flex items-center justify-center transition-colors shrink-0 ${isDone ? 'bg-emerald-500 border-emerald-500 text-white dark:text-slate-950' : 'border-slate-400 dark:border-slate-500'}">
                                            ${isDone ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                                        </button>
                                        <div class="flex-1 min-w-0">
                                            <span class="text-sm block ${isDone ? 'line-through text-slate-400 dark:text-slate-600' : 'text-slate-800 dark:text-slate-200'}">${this.escapeHTML(t.text)}</span>
                                            ${goalText}
                                            ${completionNoteText}
                                            ${completionDetailButton}
                                            ${sliderProgress}
                                            ${counterProgress}
                                        </div>
                                    </div>
                                `;
                            });
                            html += `</div></div>`;
                        }
                    });
                    html += `</div>`;
                }
                container.innerHTML = html;
            },

            saveMoodEmoji(emoji) {
                if (!this.data.mood[this.currentDate]) this.data.mood[this.currentDate] = { note: '' };
                this.data.mood[this.currentDate].emoji = emoji;
                this.saveData();
                this.renderToday(document.getElementById('main-content'));
                lucide.createIcons();
                this.showMorningToast(MORNING_MESSAGES[EMOJIS.indexOf(emoji)] || 'Wishing you a meaningful day.');
            },

            showMorningToast(message) {
                const toast = document.getElementById('morning-toast');
                toast.textContent = message;
                clearTimeout(this.morningToastTimeout);
                toast.classList.remove('hidden');
                requestAnimationFrame(() => {
                    toast.classList.remove('opacity-0', 'translate-y-3');
                });
                this.morningToastTimeout = setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-3');
                    setTimeout(() => toast.classList.add('hidden'), 200);
                }, 3200);
            },

            saveMoodNote(note) {
                if (!this.data.mood[this.currentDate]) this.data.mood[this.currentDate] = { emoji: '' };
                this.data.mood[this.currentDate].note = note;
                this.saveData();
            },

            toggleTaskFromToday(taskId) {
                this.toggleTaskCompletion(taskId, this.currentDate);
                this.updateHeaderStats();
                this.renderToday(document.getElementById('main-content'));
                lucide.createIcons();
            },

            setGrowthTab(tabId) {

                this.renderGrowth(document.getElementById('main-content'));
                lucide.createIcons();
            },

                const inactiveTabClass = 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200';

                        <button onclick="app.setGrowthTab('task-streak')" class="${tabBase} ${!isSystemPillars ? activeTabClass : inactiveTabClass}">Task Streak</button>

                      <!--  <h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-white">System Pillars</h2> -->
                        <div class="grid grid-cols-2 gap-4"> 
                    `;

                    PILLARS.forEach(p => {

                                <div class="p-4 rounded-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 ${p.text}">

                        .filter(t => this.parseDateString(t.startDate) <= this.parseDateString(this.currentDate))

                    html += `
                    <div>
                        <div class="mb-3 flex items-end justify-between gap-3">
                            <div class="min-w-0">
                                <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Task Streak</h2>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Lifetime task appearances and completions through today.</p>

                            <span class="shrink-0 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">${taskStreakItems.length} tasks</span>
                        </div>
                `;

                    if (taskStreakItems.length === 0) {

                        `;

                        taskStreakItems.forEach(({ task, pillar, stats }) => {
                            html += `

                                    <div class="flex items-start justify-between gap-2 min-w-0">
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-2 min-w-0">

            // --- MODAL & FORMS (Growth Tab) ---

            addGoal(e) {

                this.renderModalContent();
                lucide.createIcons();

            deleteGoal(id) {

                this.renderModalContent();
                lucide.createIcons();
