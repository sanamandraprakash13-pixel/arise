                            </div>

                            <div class="space-y-2 rounded-lg border border-slate-200 dark:border-slate-700 p-3">
                                <label class="flex items-center justify-between text-sm text-slate-700 dark:text-slate-300"><span>Add progress slider</span><input id="t-has-slider" type="checkbox" onchange="app.toggleTaskProgressOptions()" class="w-4 h-4 rounded text-emerald-500"></label>
                                <div id="t-slider-options" class="hidden"><label class="text-xs text-slate-500">Target value<input id="t-slider-target" type="number" min="1" step="1" value="100" class="mt-1 w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-white"></label></div>
                                <label class="flex items-center justify-between text-sm text-slate-700 dark:text-slate-300"><span>Add counter</span><input id="t-has-counter" type="checkbox" onchange="app.toggleTaskProgressOptions()" class="w-4 h-4 rounded text-emerald-500"></label>
                                <div id="t-counter-options" class="hidden"><label class="text-xs text-slate-500">Target count<input id="t-counter-target" type="number" min="0" step="1" value="1" class="mt-1 w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-white"></label></div>
                            </div>
                            
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-sm font-semibold text-white">Add Task</button>
                        </form>
                    </div>
                    
                    <div class="space-y-2 pb-10">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">All Tasks in Pillar</h4>
                `;

                if (tasks.length === 0) html += `<div class="text-center py-4 text-xs text-slate-500">No tasks configured.</div>`;
                tasks.forEach(t => {
                    if (this.editingTaskId === t.id) {
                        html += `
                            <form onsubmit="app.updateTask(event, '${t.id}')" class="space-y-2 bg-white dark:bg-slate-900 p-3 rounded-lg border border-emerald-400 dark:border-emerald-600">
                                <input id="edit-task-text-${t.id}" type="text" required value="${this.escapeHTML(t.text)}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-800 dark:text-white">
                                <div class="flex gap-2"><select id="edit-task-goal-${t.id}" class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-700 dark:text-slate-300">${goalOpts.replace(`value=\"${t.goalId}\"`, `value=\"${t.goalId}\" selected`)}</select><select id="edit-task-freq-${t.id}" class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-700 dark:text-slate-300">${['once', 'daily', 'weekly', 'biweekly', 'monthly', 'custom'].map(f => `<option value="${f}" ${t.frequency === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
                                <div class="flex justify-between text-[10px] text-slate-500">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((day, idx) => `<label class="flex items-center gap-1"><input type="checkbox" value="${idx}" class="edit-custom-day-${t.id}" ${(t.customDays || []).includes(idx) ? 'checked' : ''}>${day}</label>`).join('')}</div>
                                <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 dark:text-slate-300"><label class="space-y-1"><span class="flex items-center gap-1"><input id="edit-task-has-slider-${t.id}" type="checkbox" ${(t.hasSlider ? 'checked' : '')}> Slider</span><input id="edit-task-slider-target-${t.id}" type="number" min="1" step="1" value="${t.sliderTarget ?? 100}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded px-2 py-1"></label><label class="space-y-1"><span class="flex items-center gap-1"><input id="edit-task-has-counter-${t.id}" type="checkbox" ${(t.hasCounter ? 'checked' : '')}> Counter</span><input id="edit-task-counter-target-${t.id}" type="number" min="0" step="1" value="${t.counterTarget ?? 1}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded px-2 py-1"></label></div>
                                <div class="flex justify-end gap-3"><button type="submit" class="text-sm text-emerald-600 dark:text-emerald-400">Save</button><button type="button" onclick="app.cancelTaskEdit()" class="text-sm text-slate-500">Cancel</button></div>
                            </form>`;

                    }
                    html += `

                            </div>

            toggleCustomDays() {
                const f = document.getElementById('t-freq').value;
                document.getElementById('custom-days-wrap').style.display = (f === 'custom') ? 'flex' : 'none';
            },

            toggleTaskProgressOptions() {
                document.getElementById('t-slider-options').classList.toggle('hidden', !document.getElementById('t-has-slider').checked);
                document.getElementById('t-counter-options').classList.toggle('hidden', !document.getElementById('t-has-counter').checked);
            },

            addTask(e) {
                e.preventDefault();
                const text = document.getElementById('t-text').value.trim();
                const goalId = document.getElementById('t-goal').value;
                const freq = document.getElementById('t-freq').value;
                const hasSlider = document.getElementById('t-has-slider').checked;
                const hasCounter = document.getElementById('t-has-counter').checked;
                const sliderTarget = parseInt(document.getElementById('t-slider-target').value, 10);
                const counterTarget = parseInt(document.getElementById('t-counter-target').value, 10);
                if (hasSlider && (!Number.isInteger(sliderTarget) || sliderTarget <= 0)) return alert('Enter a whole-number slider target greater than zero.');
                if (hasCounter && (!Number.isInteger(counterTarget) || counterTarget <= 0)) return alert('Enter a counter target greater than zero.');

                let customDays = [];
                if (freq === 'custom') {
                    document.querySelectorAll('.custom-day-cb:checked').forEach(cb => customDays.push(parseInt(cb.value)));
                    if (customDays.length === 0) return alert("Select at least one day.");
                }

                this.data.tasks.push({
                    id: 't-' + Date.now(),
                    pillar: this.activePillarId,
                    text: text,
                    goalId: goalId || null,
                    frequency: freq,
                    customDays: customDays,
                    hasSlider: hasSlider,
                    sliderTarget: hasSlider ? sliderTarget : null,
                    hasCounter: hasCounter,
                    counterTarget: hasCounter ? counterTarget : null,
                    startDate: this.currentDate
                });

                this.saveData();
                this.renderModalContent();
                lucide.createIcons();
                if (this.currentTab === 'today') this.renderToday(document.getElementById('main-content'));
            },

            deleteTask(id) {
                this.data.tasks = this.data.tasks.filter(t => t.id !== id);
                delete this.data.taskCompletions[id];
                delete this.data.taskProgress[id];
                this.saveData();
                this.renderModalContent();
                lucide.createIcons();
            },

            startTaskEdit(id) { this.editingTaskId = id; this.renderModalContent(); lucide.createIcons(); },
            cancelTaskEdit() { this.editingTaskId = null; this.renderModalContent(); lucide.createIcons(); },
            updateTask(e, id) {
                e.preventDefault();
                const task = this.data.tasks.find(t => t.id === id);
                if (!task) return;
                const text = document.getElementById(`edit-task-text-${id}`).value.trim();
                if (!text) return;
                task.text = text;
                task.goalId = document.getElementById(`edit-task-goal-${id}`).value || null;
                task.frequency = document.getElementById(`edit-task-freq-${id}`).value;
                task.hasSlider = document.getElementById(`edit-task-has-slider-${id}`).checked;
                task.hasCounter = document.getElementById(`edit-task-has-counter-${id}`).checked;
                const sliderTarget = parseInt(document.getElementById(`edit-task-slider-target-${id}`).value, 10);
                const counterTarget = parseInt(document.getElementById(`edit-task-counter-target-${id}`).value, 10);
                if (task.hasSlider && (!Number.isInteger(sliderTarget) || sliderTarget <= 0)) return alert('Enter a whole-number slider target greater than zero.');
                if (task.hasCounter && (!Number.isInteger(counterTarget) || counterTarget <= 0)) return alert('Enter a counter target greater than zero.');
                task.sliderTarget = task.hasSlider ? sliderTarget : null;
                task.counterTarget = task.hasCounter ? counterTarget : null;
                const customDays = Array.from(document.querySelectorAll(`.edit-custom-day-${id}:checked`)).map(input => parseInt(input.value));
                if (task.frequency === 'custom' && !customDays.length) return alert('Select at least one custom day.');
                task.customDays = customDays;
                this.editingTaskId = null;
                this.saveData(); this.renderModalContent(); lucide.createIcons();
                if (this.currentTab === 'today') this.renderToday(document.getElementById('main-content'));
            },

            renderAchievementsTab(container, achievements) {
                const tasks = this.data.tasks.filter(t => t.pillar === this.activePillarId);
                let taskOpts = `<option value="">-- Select Habit/Task --</option>`;
                tasks.forEach(t => taskOpts += `<option value="${t.id}">${this.escapeHTML(t.text)}</option>`);

                let html = `

                        <form onsubmit="app.addAchievement(event)" class="space-y-3">
                            <input type="text" id="a-text" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-white" placeholder="Achievement Name (e.g. Iron Will)">
                            
                            <select id="a-type" onchange="app.toggleAchType()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-700 dark:text-slate-300">

                                <option value="streak">Milestone / Total Completions</option>
                            </select>

                                <select id="a-task" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-700 dark:text-slate-300">${taskOpts}</select>
                                <input type="number" id="a-target" placeholder="Target Completions (e.g. 10)" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-white">
                            </div>
                            
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-sm font-semibold text-white">Add Achievement</button>
                        </form>
                    </div>
                    
                    <div class="space-y-2 pb-10">
                `;

                if (achievements.length === 0) html += `<div class="text-center py-4 text-xs text-slate-500">No achievements configured.</div>`;

                achievements.forEach(a => {
                    let progressHtml = '';
                    let isCompleted = a.completed;

                    if (a.type === 'streak' && a.taskId) {
                        const currentTaskStreak = app.getTaskStreak(a.taskId, app.currentDate);
                        isCompleted = currentTaskStreak >= a.target;
                        progressHtml = `<div class="text-[10px] mt-1 ${isCompleted ? 'text-emerald-400' : 'text-slate-500'}">Streak Progress: ${currentTaskStreak} / ${a.target}</div>
                                        <div class="w-full h-1 bg-slate-800 rounded-full mt-1"><div class="h-full bg-emerald-500 rounded-full" style="width: ${Math.min((currentTaskStreak / a.target) * 100, 100)}%"></div></div>`;
                    }

                    html += `
                        <div class="flex items-start justify-between bg-slate-900 p-3 rounded-lg border ${isCompleted ? 'border-emerald-500/50 bg-emerald-500/5' : 'border-slate-800'}">
                            <div class="flex items-start space-x-3 flex-1 min-w-0">
                                ${a.type === 'manual' ? `
                                    <button onclick="app.toggleManualAch('${a.id}')" class="mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white dark:text-slate-950' : 'border-slate-300 dark:border-slate-500'}">
                                        ${isCompleted ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                                    </button>
                                ` : `
                                    <div class="mt-0.5 w-5 h-5 rounded flex items-center justify-center shrink-0 ${isCompleted ? 'text-emerald-500' : 'text-slate-400 dark:text-slate-600'}">
                                        <i data-lucide="trophy" class="w-4 h-4"></i>
                                    </div>
                                `}
                                <div class="flex-1 min-w-0">
                                    <span class="text-sm font-medium ${isCompleted ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-200'} block">${this.escapeHTML(a.text)}</span>
                                    ${progressHtml}
                                </div>
                            </div>
                            <button onclick="app.deleteAchievement('${a.id}')" class="text-slate-500 hover:text-rose-500 dark:text-slate-600 dark:hover:text-rose-400 ml-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML = html;
            },

            toggleAchType() {
                const t = document.getElementById('a-type').value;
                document.getElementById('a-streak-wrap').style.display = (t === 'streak') ? 'block' : 'none';
            },

            addAchievement(e) {
                e.preventDefault();
                const type = document.getElementById('a-type').value;
                const text = document.getElementById('a-text').value.trim();
                const ach = { id: 'a-' + Date.now(), text, type, completed: false };

                if (type === 'streak') {
                    ach.taskId = document.getElementById('a-task').value;
                    ach.target = parseInt(document.getElementById('a-target').value);
                    if (!ach.taskId || !ach.target) return alert("Select task and target count.");
                }

                this.data.pillars[this.activePillarId].achievements.push(ach);
                this.saveData();
                this.renderModalContent();
                lucide.createIcons();
            },

            toggleManualAch(id) {
                const a = this.data.pillars[this.activePillarId].achievements.find(x => x.id === id);
                if (a && a.type === 'manual') {
                    a.completed = !a.completed;
                    this.saveData();
                    this.renderModalContent();
                    lucide.createIcons();
                }
            },

            deleteAchievement(id) {
                this.data.pillars[this.activePillarId].achievements = this.data.pillars[this.activePillarId].achievements.filter(a => a.id !== id);
                this.saveData();
                this.renderModalContent();
                lucide.createIcons();
            },

            // --- TAB 3: PROGRESS ---
            renderProgress(container) {
                container.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-white">Alignment Matrix</h2>
                    
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm mb-8 flex justify-center items-center transition-colors duration-300">
                        <div class="relative w-full max-w-[280px] aspect-square">
                            <canvas id="radar-chart" class="w-full h-full"></canvas>
                        </div>
                    </div>
                    <div class="space-y-4 pb-4">
                        <h3 class="font-semibold text-slate-500 dark:text-slate-400 uppercase text-xs tracking-wider">Completion Ratios</h3>
                        <div id="progress-bars" class="space-y-4"></div>
                    </div>
                    <div id="weekly-review" class="mt-8"></div>
                    <div id="completion-calendar" class="mt-8 pb-8"></div>
                `;

                // Calculate accurate Alignment Scores (Goals + Achievements + Tasks)
                const scores = PILLARS.map(p => {
                    let totalWeight = 0;
                    let earnedWeight = 0;

                    const pGoals = this.data.pillars[p.id].goals || [];
                    const pAchs = this.data.pillars[p.id].achievements || [];
                    const pTasks = this.data.tasks.filter(t => t.pillar === p.id);

                    // 1. Goals (Weight 1)
                    totalWeight += pGoals.length;
                    earnedWeight += pGoals.filter(g => g.completed).length;

                    // 2. Achievements (Weight 1)
                    totalWeight += pAchs.length;
                    earnedWeight += pAchs.filter(a => a.completed).length;

                    // 3. Tasks (Weight 1 max per task, earned by recent/consistent completions)
                    pTasks.forEach(t => {
                        totalWeight += 1;
                        const comps = this.data.taskCompletions[t.id] ? this.data.taskCompletions[t.id].length : 0;
                        // Max out a task's contribution at 7 completions (1 week streak proxy)
                        earnedWeight += Math.min(comps / 7, 1);
                    });

                    if (totalWeight === 0) return 0;
                    return Math.min(earnedWeight / totalWeight, 1);
                });

                let barHtml = '';
                PILLARS.forEach((p, idx) => {
                    const pct = Math.round(scores[idx] * 100);
                    barHtml += `
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-slate-700 dark:text-slate-200 font-medium">${p.name}</span>
                                <span class="text-slate-500 dark:text-slate-400">${pct}%</span>
                            </div>
                            <div class="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full ${p.color.replace('bg-', 'bg-')} rounded-full" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('progress-bars').innerHTML = barHtml;

                this.renderWeeklyReview();
                this.renderCompletionCalendar();

                setTimeout(() => this.drawRadarChart('radar-chart', scores), 50);
            },

            changeProgressWeek(offset) {
                this.progressWeekOffset += offset;
                this.renderWeeklyReview();
                lucide.createIcons();
            },

            renderWeeklyReview() {
                const container = document.getElementById('weekly-review');
                if (!container) return;
                const base = this.getWeekStart(this.parseDateString(this.currentDate));
                base.setDate(base.getDate() + (this.progressWeekOffset * 7));
                const end = new Date(base.getFullYear(), base.getMonth(), base.getDate() + 6);
                const stats = this.getPeriodTaskStats(base);
                const pillarStats = PILLARS.map(p => ({ pillar: p, ...this.getPeriodTaskStats(base, 7, p.id) }));
                const strongest = pillarStats.filter(item => item.scheduled > 0).sort((a, b) => b.rate - a.rate || b.completed - a.completed)[0];
                const range = `${base.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${end.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
                container.innerHTML = `
                    <div class="flex items-center justify-between mb-3"><div><h3 class="font-bold text-slate-800 dark:text-white">Weekly review</h3><p class="text-xs text-slate-500 dark:text-slate-400">Sunday–Saturday · ${range}</p></div><div class="flex gap-1"><button onclick="app.changeProgressWeek(-1)" title="Previous week" class="p-2 rounded-lg text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/50"><i data-lucide="chevron-left" class="w-4 h-4"></i></button><button onclick="app.changeProgressWeek(1)" title="Next week" class="p-2 rounded-lg text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button></div></div>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500">Completion rate</div><div class="mt-1 text-lg font-bold text-emerald-600 dark:text-emerald-400">${stats.rate}%</div><div class="text-[11px] text-slate-500">${stats.completed}/${stats.scheduled || 0} tasks</div></div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500">Mood trend</div>${this.getMoodTrendChart(base)}</div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500">Strongest pillar</div><div class="mt-1 text-sm font-bold text-slate-800 dark:text-white">${strongest ? strongest.pillar.name : 'No task data'}</div><div class="text-[11px] text-slate-500">${strongest ? `${strongest.rate}% completed` : 'Add scheduled tasks'}</div></div>
                    </div>`;
                lucide.createIcons();
            },

            changeProgressMonth(offset) {
                this.progressMonthOffset += offset;
                this.renderCompletionCalendar();
                lucide.createIcons();
            },

            renderCompletionCalendar() {
                const container = document.getElementById('completion-calendar');
                if (!container) return;
                const selected = this.parseDateString(this.currentDate);
                const month = new Date(selected.getFullYear(), selected.getMonth() + this.progressMonthOffset, 1);
                const firstGridDay = new Date(month.getFullYear(), month.getMonth(), 1 - month.getDay());
                const today = this.dateToString(new Date());
                let cells = '';
                for (let i = 0; i < 42; i++) {
                    const day = new Date(firstGridDay.getFullYear(), firstGridDay.getMonth(), firstGridDay.getDate() + i);
                    const inMonth = day.getMonth() === month.getMonth();
                    const dateStr = this.dateToString(day);
                    const stats = this.getPeriodTaskStats(day, 1);
                    const intensity = stats.scheduled ? Math.max(10, stats.rate) : 0;
                    const bg = intensity ? `background-color: rgba(16, 185, 129, ${0.12 + (intensity / 100) * 0.78})` : '';
                    cells += `<div title="${dateStr}: ${stats.completed}/${stats.scheduled} tasks (${stats.rate}%)" style="${bg}" class="aspect-square rounded-lg border ${inMonth ? 'border-slate-200 dark:border-slate-700' : 'border-transparent opacity-35'} ${dateStr === today ? 'ring-2 ring-emerald-500' : ''} p-1 flex flex-col justify-between"><span class="text-[10px] ${intensity > 60 ? 'text-white font-bold' : 'text-slate-500 dark:text-slate-400'}">${day.getDate()}</span>${inMonth && stats.scheduled ? `<span class="text-[9px] text-right ${intensity > 60 ? 'text-white' : 'text-slate-600 dark:text-slate-300'}">${stats.completed}/${stats.scheduled}</span>` : ''}</div>`;
                }
                container.innerHTML = `
                    <div class="flex items-center justify-between mb-3"><div><h3 class="font-bold text-slate-800 dark:text-white">Monthly completion heat map</h3><p class="text-xs text-slate-500 dark:text-slate-400">Each day shows completed scheduled tasks</p></div><div class="flex gap-1"><button onclick="app.changeProgressMonth(-1)" title="Previous month" class="p-2 rounded-lg text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/50"><i data-lucide="chevron-left" class="w-4 h-4"></i></button><button onclick="app.changeProgressMonth(1)" title="Next month" class="p-2 rounded-lg text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button></div></div>
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3"><div class="text-center text-sm font-semibold text-slate-800 dark:text-white mb-3">${month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div><div class="grid grid-cols-7 gap-1 mb-1">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="text-center text-[10px] text-slate-500">${d}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${cells}</div><div class="mt-3 text-[10px] text-slate-500">Cells show done/scheduled. Light = lower completion · darker = higher completion.</div></div>`;
                lucide.createIcons();
            },

            drawRadarChart(canvasId, scores) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const size = canvas.parentElement.clientWidth || 280;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = size * dpr; canvas.height = size * dpr;
                ctx.scale(dpr, dpr);

                // Extra padding for labels
                const cx = size / 2, cy = size / 2, radius = (size / 2) - 40, sides = 7;
                const isDark = document.documentElement.classList.contains('dark');

                const getPoint = (val, i) => {
                    const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
                    return { x: cx + radius * val * Math.cos(angle), y: cy + radius * val * Math.sin(angle) };
                };

                // Draw Web / Grid
                ctx.lineWidth = 1;
                for (let level = 1; level <= 4; level++) {
                    const rLevel = level / 4;
                    ctx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const p = getPoint(rLevel, i);
                        i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                    }
                    ctx.closePath();
                    // Grid color based on theme
                    ctx.strokeStyle = isDark ? `rgba(51, 65, 85, ${rLevel === 1 ? '1' : '0.4'})` : `rgba(203, 213, 225, ${rLevel === 1 ? '1' : '0.6'})`;
                    ctx.stroke();
                }

                // Draw Spokes and Labels
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                for (let i = 0; i < sides; i++) {
                    const pMax = getPoint(1, i);
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pMax.x, pMax.y);
                    ctx.strokeStyle = isDark ? 'rgba(51, 65, 85, 0.4)' : 'rgba(203, 213, 225, 0.6)';
                    ctx.stroke();

                    const pLabel = getPoint(1.25, i); // Push out further to fit text

                    // Main Pillar Label
                    ctx.fillStyle = isDark ? '#94a3b8' : '#64748b';
                    ctx.font = 'bold 10px Inter';
                    ctx.fillText(PILLARS[i].name.substring(0, 3).toUpperCase(), pLabel.x, pLabel.y - 6);

                    // Percentage Label
                    const pct = Math.round(scores[i] * 100) + '%';
                    ctx.font = '9px Inter';
                    ctx.fillStyle = isDark ? '#64748b' : '#94a3b8';
                    ctx.fillText(pct, pLabel.x, pLabel.y + 6);
                }

                // Draw Data Polygon
                ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const val = scores[i]; // Allows true zero
                    const p = getPoint(val, i);
                    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                }
                ctx.closePath();

                // Create shaded gradient fill based on how much is done
                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.7)'); // Stronger green at the center
                gradient.addColorStop(1, 'rgba(16, 185, 129, 0.1)'); // Fades outwards

                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#34d399';
                ctx.stroke();

                // Draw Data Points (Dots on vertices)
                for (let i = 0; i < sides; i++) {
                    const val = scores[i];
                    const p = getPoint(val, i);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#10b981'; // Solid emerald dot
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = isDark ? '#020617' : '#ffffff'; // Border matches background theme
                    ctx.stroke();
                }
            },

            // --- TAB 4: JOURNAL (DIGITAL DIARY) ---
            renderJournal(container) {
                // To maintain backward compatibility if user had multiple array items, we consolidate them into text
                const entries = this.data.journal.filter(j => j.date === this.currentDate);
                const content = entries.length > 0 ? entries.map(e => e.content).join('\n\n') : '';

                container.innerHTML = `
                    <div class="flex flex-col flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm min-h-0 transition-colors duration-300">
                        
                        <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/50 flex justify-between items-center shrink-0">
                            <button onclick="app.changeDateOffset(-1)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg text-slate-500 transition-colors"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                            <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                <i data-lucide="book-open" class="w-5 h-5 text-emerald-500 dark:text-emerald-400"></i>
                                ${this.currentDate}
                            </h3>
                            <button onclick="app.changeDateOffset(1)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg text-slate-500 transition-colors"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                        </div>
                        
                        <div class="flex-1 flex flex-col min-h-0 relative">
                            <textarea id="diary-textarea" oninput="app.autoSaveDiary(this.value)" class="flex-1 w-full h-full bg-transparent p-5 sm:p-6 text-sm text-slate-800 dark:text-slate-200 focus:outline-none resize-none hide-scrollbar placeholder-slate-400 dark:placeholder-slate-500 leading-relaxed" placeholder="Write your thoughts, ideas, or daily reflections here..."></textarea>
                        </div>
                        
                        <div class="px-4 py-2 bg-slate-50 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 text-[10px] text-slate-400 dark:text-slate-500 text-right shrink-0" id="diary-save-status">
                            All changes saved locally.
                        </div>
                    </div>
                `;

                document.getElementById('diary-textarea').value = content;
            },

            autoSaveDiary(val) {
                // Clear any existing entries for this date to replace with a single text block
                this.data.journal = this.data.journal.filter(j => j.date !== this.currentDate);

                if (val.trim()) {
                    this.data.journal.push({
                        id: 'j-' + Date.now(),
                        date: this.currentDate,
                        type: 'text',
                        content: val,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                }

                this.saveData();

                // Update save status text
                const status = document.getElementById('diary-save-status');
                if (status) {
                    status.innerText = 'Saving...';
                    clearTimeout(this.saveTimeout);
                    this.saveTimeout = setTimeout(() => {
                        status.innerText = 'All changes saved locally.';
                    }, 800);
                }
            },

            escapeHTML(str) {
                return str ? str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t])) : '';
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>

    <script>
        if ('serviceWorker' in navigator) {

            window.addEventListener('load', async () => {

                try {

                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));

                    if ('caches' in window) {
                        const cacheKeys = await caches.keys();
                        await Promise.all(cacheKeys.map(key => caches.delete(key)));
                    }

                    console.log("Offline support disabled");

                } catch (err) {

                    console.error(err);

                }

            });

        }

    </script>
</body>

</html>
